name: Validate Ansible Infrastructure Baseline

on:
  push:
    paths:
      - 'projects/ansible-infrastructure-baseline/**'
      - '.github/workflows/ansible-baseline.yml'
  pull_request:
    paths:
      - 'projects/ansible-infrastructure-baseline/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ansible-infrastructure-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible
        run: python -m pip install 'ansible-core>=2.17,<2.19'
      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Inventory syntax
        run: ansible-inventory --list >/dev/null
      - name: Playbook syntax
        run: ansible-playbook playbooks/site.yml --syntax-check
